# Audio-to-Score Model Configuration
# Two-Stage Architecture: Acoustic Model (Audio→MIDI) + PM2S (MIDI→Score)

# =============================================================================
# Stage 1: Acoustic Model Configuration
# =============================================================================

acoustic_model:
  # Feature Extraction
  feature_extractor:
    sample_rate: 16000
    n_mels: 128
    n_fft: 2048
    hop_length: 160  # 10ms at 16kHz
    win_length: 400  # 25ms at 16kHz
    f_min: 20.0
    f_max: 8000.0
    normalize: true

  # Conformer Encoder
  encoder:
    type: "conformer"
    num_layers: 12
    hidden_dim: 512
    num_heads: 8
    conv_kernel_size: 31
    ffn_dim: 2048
    dropout: 0.1
    attention_dropout: 0.1
    conv_dropout: 0.1
    # Pretrained initialization
    pretrained: "musicfm"  # Options: "musicfm", "mert", "random"
    pretrained_path: null  # Path to custom pretrained weights
    freeze_encoder: false  # Whether to freeze encoder during initial training

  # Perceiver IO Bottleneck
  bottleneck:
    type: "perceiver_io"
    num_latents: 512
    latent_dim: 512
    num_cross_attention_layers: 2
    num_self_attention_layers: 6
    num_heads: 8
    dropout: 0.1

  # MoE Transformer Decoder
  decoder:
    type: "moe_transformer"
    num_layers: 6
    hidden_dim: 512
    num_heads: 8
    ffn_dim: 2048
    dropout: 0.1
    # Mixture of Experts
    moe:
      enabled: true
      num_experts: 8
      top_k: 2  # Top-2 routing
      moe_layer_freq: 2  # Apply MoE every 2nd FFN layer
      load_balancing_loss_weight: 0.01
    # Output
    max_seq_length: 8192

  # Tokenizer
  tokenizer:
    vocab_size: 519
    note_on_tokens: 128      # MIDI pitches 0-127
    note_off_tokens: 128     # MIDI pitches 0-127
    time_shift_tokens: 100   # 10ms to 1000ms in 10ms steps
    velocity_tokens: 32      # 32 velocity bins
    program_tokens: 128      # MIDI programs
    special_tokens: 3        # <SOS>, <EOS>, <PAD>
    time_shift_ms: 10        # Time shift resolution in ms

# =============================================================================
# Stage 2: PM2S Model Configuration (Performance MIDI to Score)
# =============================================================================

pm2s_model:
  # Rhythm Quantization Module
  rhythm_quantizer:
    type: "bidirectional_transformer"
    num_layers: 12
    hidden_dim: 512
    num_heads: 8
    ffn_dim: 2048
    dropout: 0.2
    max_seq_len: 8192
    # Grid settings
    max_subdivisions: 16  # Up to 16th notes
    triplet_support: true

  # Voice Separation Module
  voice_separator:
    type: "transformer"
    num_layers: 8
    hidden_dim: 512
    num_heads: 8
    max_voices: 4  # Maximum number of simultaneous voices
    dropout: 0.1
    max_seq_len: 8192

  # Key Estimation Module
  key_estimator:
    type: "global_attention"
    hidden_dim: 512
    num_keys: 30  # 15 major + 15 minor keys

  # Score Generator
  score_generator:
    output_format: "musicxml"
    use_music21: true
    default_tempo: 120
    default_time_signature: "4/4"

# =============================================================================
# Inference Configuration
# =============================================================================

inference:
  # Beam search
  beam_size: 5
  max_length: 8192
  length_penalty: 1.0
  temperature: 1.0

  # Chunking for long audio
  chunk_size_seconds: 30
  chunk_overlap_seconds: 5

  # Post-processing
  min_note_duration_ms: 30
  merge_repeated_notes: true
